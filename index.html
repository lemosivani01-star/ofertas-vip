<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofertas VIP — Painel de Automação</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Configuração da Paleta Personalizada da Logo -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nudeBg: '#F7F5F2',       /* Branco Off / Fundo leve */
              nudeCard: '#E8D5C4',     /* Nude Elegante */
              roseAccent: '#D8A7B1',   /* Rosé Suave */
              coffeeText: '#6B4F4F',   /* Marrom Café */
              coffeeDark: '#4A3434',   /* Marrom Café Escuro */
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-nudeBg text-coffeeText min-h-screen pb-12">

    <!-- Cabeçalho na Paleta Nude / Marrom Café -->
    <header class="bg-nudeCard text-coffeeText p-4 shadow-sm sticky top-0 z-20 flex justify-between items-center border-b border-roseAccent/40">
      <div class="flex items-center space-x-3">
        <!-- Cole o link da sua logo abaixo no src se desejar -->
        <div class="w-9 h-9 rounded-xl bg-roseAccent/30 flex items-center justify-center border border-roseAccent/50">
          <i class="fa-solid fa-crown text-coffeeText"></i>
        </div>
        <h1 class="text-lg font-bold tracking-wide text-coffeeText">Ofertas VIP</h1>
      </div>
      <span class="text-xs bg-roseAccent text-white font-medium px-3 py-1 rounded-full shadow-sm flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> Automação Ativa
      </span>
    </header>

    <!-- Navegação por Abas com Cores da Logo -->
    <nav class="bg-white border-b border-roseAccent/30 px-2 flex justify-around text-xs font-semibold text-coffeeText/70 sticky top-[69px] z-10 shadow-xs">
      <button onclick="switchTab('dashboard')" id="btn-dashboard" class="py-3 border-b-2 border-coffeeText text-coffeeText font-bold flex items-center gap-1.5">
        <i class="fa-solid fa-chart-line"></i> Painel
      </button>
      <button onclick="switchTab('niche')" id="btn-niche" class="py-3 border-b-2 border-transparent hover:text-coffeeText flex items-center gap-1.5">
        <i class="fa-solid fa-shirt"></i> Nicho & Moda
      </button>
      <button onclick="switchTab('schedule')" id="btn-schedule" class="py-3 border-b-2 border-transparent hover:text-coffeeText flex items-center gap-1.5">
        <i class="fa-solid fa-clock"></i> Disparos
      </button>
      <button onclick="switchTab('settings')" id="btn-settings" class="py-3 border-b-2 border-transparent hover:text-coffeeText flex items-center gap-1.5">
        <i class="fa-solid fa-gear"></i> Conexões
      </button>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-4">

      <!-- ABA 1: PAINEL PRINCIPAL -->
      <section id="tab-dashboard" class="tab-content space-y-4">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-roseAccent/20 space-y-3">
          <h2 class="text-sm font-bold text-coffeeText flex items-center justify-between">
            <span>Status da Automação</span>
            <i class="fa-solid fa-robot text-roseAccent"></i>
          </h2>
          <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-nudeBg p-3 rounded-xl border border-nudeCard">
              <span class="block text-[11px] text-coffeeText/70 font-medium">Ofertas Enviadas</span>
              <span class="text-xl font-extrabold text-coffeeText">124</span>
            </div>
            <div class="bg-nudeBg p-3 rounded-xl border border-nudeCard">
              <span class="block text-[11px] text-coffeeText/70 font-medium">Grupos Conectados</span>
              <span class="text-xl font-extrabold text-coffeeText">8</span>
            </div>
          </div>
        </div>

        <!-- Conversor de Link -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-roseAccent/20 space-y-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-coffeeText/60">Conversor Rápido de Link</h3>
          <input type="url" id="rawUrl" placeholder="Cole o link do produto (Shopee, Shein, Mercado Livre)..." class="w-full p-3 border border-nudeCard rounded-xl text-xs focus:ring-2 focus:ring-roseAccent outline-none bg-nudeBg/50 text-coffeeText">
          
          <button onclick="processLink()" class="w-full bg-coffeeText hover:bg-coffeeDark text-white font-medium py-3 rounded-xl text-xs shadow-md flex items-center justify-center gap-2 transition active:scale-95">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Gerar Link de Afiliado + Copy IA
          </button>
          
          <textarea id="previewArea" rows="6" class="w-full p-3 border border-nudeCard rounded-xl text-xs bg-nudeBg font-mono text-coffeeText hidden focus:outline-none" readonly></textarea>

          <button id="btnSendWhatsapp" onclick="sendWhatsapp()" class="w-full bg-roseAccent hover:bg-roseAccent/90 text-white font-bold py-3 rounded-xl text-xs shadow-md hidden flex items-center justify-center gap-2 transition active:scale-95">
            <i class="fa-brands fa-whatsapp text-base"></i> Enviar para Grupo VIP
          </button>
        </div>
      </section>

      <!-- ABA 2: NICHO E MODA -->
      <section id="tab-niche" class="tab-content space-y-4 hidden">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-roseAccent/20 space-y-3">
          <h2 class="text-sm font-bold text-coffeeText flex items-center gap-2">
            <i class="fa-solid fa-filter text-roseAccent"></i> Filtros de Moda Feminina
          </h2>
          
          <div>
            <label class="block text-xs font-semibold text-coffeeText mb-2">Categorias Prioritárias</label>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <label class="flex items-center gap-2 p-2.5 border border-nudeCard rounded-xl bg-nudeBg/40"><input type="checkbox" checked class="accent-coffeeText"> Vestidos</label>
              <label class="flex items-center gap-2 p-2.5 border border-nudeCard rounded-xl bg-nudeBg/40"><input type="checkbox" checked class="accent-coffeeText"> Saias</label>
              <label class="flex items-center gap-2 p-2.5 border border-nudeCard rounded-xl bg-nudeBg/40"><input type="checkbox" checked class="accent-coffeeText"> Blusas / Tops</label>
              <label class="flex items-center gap-2 p-2.5 border border-nudeCard rounded-xl bg-nudeBg/40"><input type="checkbox" class="accent-coffeeText"> Calçados</label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-coffeeText mb-1">Desconto Mínimo Obrigatório</label>
            <select class="w-full p-2.5 border border-nudeCard rounded-xl text-xs bg-nudeBg text-coffeeText focus:ring-2 focus:ring-roseAccent outline-none">
              <option>Apenas produtos com 30% OFF ou mais</option>
              <option selected>Apenas produtos com 50% OFF ou mais</option>
              <option>Apenas menor preço dos últimos 30 dias</option>
            </select>
          </div>
        </div>
      </section>

      <!-- ABA 3: AGENDAMENTO -->
      <section id="tab-schedule" class="tab-content space-y-4 hidden">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-roseAccent/20 space-y-3">
          <h2 class="text-sm font-bold text-coffeeText flex items-center gap-2">
            <i class="fa-solid fa-clock text-roseAccent"></i> Agendamento de Disparos
          </h2>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-coffeeText mb-1">Intervalo de Envio</label>
              <select class="w-full p-2.5 border border-nudeCard rounded-xl text-xs bg-nudeBg text-coffeeText outline-none">
                <option>A cada 30 minutos</option>
                <option selected>A cada 1 hora</option>
                <option>A cada 2 horas</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-coffeeText mb-1">Modo Anti-Bloqueio</label>
              <select class="w-full p-2.5 border border-nudeCard rounded-xl text-xs bg-nudeBg text-coffeeText outline-none">
                <option selected>Ativado (Varia 5-10min)</option>
                <option>Desativado</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-coffeeText mb-1">Horário de Funcionamento</label>
            <div class="flex items-center gap-2 text-xs">
              <input type="time" value="08:00" class="p-2 border border-nudeCard rounded-xl w-full bg-nudeBg text-coffeeText">
              <span>até</span>
              <input type="time" value="22:00" class="p-2 border border-nudeCard rounded-xl w-full bg-nudeBg text-coffeeText">
            </div>
          </div>
        </div>
      </section>

      <!-- ABA 4: CONEXÕES E APIS -->
      <section id="tab-settings" class="tab-content space-y-4 hidden">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-roseAccent/20 space-y-3">
          <h3 class="text-xs font-bold text-coffeeText flex items-center gap-2">
            <i class="fa-brands fa-whatsapp text-roseAccent text-base"></i> Conexão WhatsApp
          </h3>
          <p class="text-xs text-coffeeText/70">Escaneie o QR Code para vincular seu número de disparo.</p>
          <button class="w-full bg-roseAccent hover:bg-roseAccent/90 text-white text-xs font-bold py-2.5 rounded-xl shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-qrcode"></i> Gerar QR Code de Conexão
          </button>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-roseAccent/20 space-y-3">
          <h3 class="text-xs font-bold text-coffeeText flex items-center gap-2">
            <i class="fa-solid fa-key text-roseAccent"></i> Chaves de API (Marketplaces)
          </h3>
          <div>
            <label class="block text-[10px] font-bold text-coffeeText/60 uppercase mb-1">Shopee App Key / Secret</label>
            <input type="text" placeholder="Cole sua chave da Shopee..." class="w-full p-2.5 border border-nudeCard rounded-xl text-xs bg-nudeBg text-coffeeText outline-none">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-coffeeText/60 uppercase mb-1">OpenAI / Gemini Key (IA)</label>
            <input type="password" placeholder="sk-..." class="w-full p-2.5 border border-nudeCard rounded-xl text-xs bg-nudeBg text-coffeeText outline-none">
          </div>
        </div>
      </section>

    </main>

    <script>
      function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(el => {
          el.classList.remove('border-coffeeText', 'text-coffeeText', 'font-bold');
          el.classList.add('border-transparent', 'text-coffeeText/70');
        });

        document.getElementById('tab-' + tabId).classList.remove('hidden');
        document.getElementById('btn-' + tabId).classList.add('border-coffeeText', 'text-coffeeText', 'font-bold');
        document.getElementById('btn-' + tabId).classList.remove('border-transparent', 'text-coffeeText/70');
      }

      function processLink() {
        const raw = document.getElementById('rawUrl').value;
        if(!raw) return alert('Por favor, cole um link de produto primeiro!');
        
        const preview = document.getElementById('previewArea');
        const btnSend = document.getElementById('btnSendWhatsapp');
        
        preview.classList.remove('hidden');
        btnSend.classList.remove('hidden');
        
        preview.value = "🚨 ACHADINHO VIP — MODA FEMININA 🚨\n\n👗 Vestido Midi Elegante Estampado\nDe: ~R$ 159,90~\nPor apenas: *R$ 69,90* 🔥 (56% OFF)\n\n🛒 Garanta o seu no link com desconto:\nhttps://shope.ee/seu_link_afiliado\n\n⚠️ _Preço sujeito a alteração a qualquer momento!_";
      }

      function sendWhatsapp() {
        const text = encodeURIComponent(document.getElementById('previewArea').value);
        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
      }
    </script>
  </body>
</html>
